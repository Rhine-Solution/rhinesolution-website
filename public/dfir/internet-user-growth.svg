<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 700px; background-color: transparent;" viewBox="0 0 700 500" role="graphics-document document" aria-roledescription="xychart"><style>#my-svg{font-family:Rijksoverheid Sans,system-ui,sans-serif;font-size:15px;fill:#F2F5FF;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#1a2640;}#my-svg .error-text{fill:#F8F5F0;stroke:#F8F5F0;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#7EA7FF;stroke:#7EA7FF;}#my-svg .marker.cross{stroke:#7EA7FF;}#my-svg svg{font-family:Rijksoverheid Sans,system-ui,sans-serif;font-size:15px;}#my-svg p{margin:0;}#my-svg .node .neo-node{stroke:#4a6db3;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#4a6db3;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g class="main"><rect width="700" height="500" class="background" fill="transparent"/><g class="chart-title"><text x="0" y="0" fill="#F2F5FF" font-size="20" dominant-baseline="middle" text-anchor="middle" transform="translate(350, 23.5) rotate(0)">Internet users worldwide</text></g><g class="plot"><g class="bar-plot-0"><rect x="72.39062690734863" y="388.1666666666667" width="199.5" height="75.83333333333331" fill="#FFF4DD" stroke="#FFF4DD" stroke-width="0"/><rect x="495.25" y="96.29999999999998" width="199.5" height="367.70000000000005" fill="#FFF4DD" stroke="#FFF4DD" stroke-width="0"/></g></g><g class="bottom-axis"><g class="axis-line"><path d="M 67.14062690734863,465 L 700,465" fill="none" stroke="#F2F5FF" stroke-width="2"/></g><g class="label"><text x="0" y="0" fill="#F2F5FF" font-size="14" dominant-baseline="text-before-edge" text-anchor="middle" transform="translate(172.14062690734863, 476) rotate(0)">2005</text><text x="0" y="0" fill="#F2F5FF" font-size="14" dominant-baseline="text-before-edge" text-anchor="middle" transform="translate(595, 476) rotate(0)">2023</text></g><g class="ticks"><path d="M 172.14062690734863,466 L 172.14062690734863,471" fill="none" stroke="#F2F5FF" stroke-width="2"/><path d="M 595,466 L 595,471" fill="none" stroke="#F2F5FF" stroke-width="2"/></g></g><g class="left-axis"><g class="axisl-line"><path d="M 66.14062690734863,47 L 66.14062690734863,464" fill="none" stroke="#F2F5FF" stroke-width="2"/></g><g class="label"><text x="0" y="0" fill="#F2F5FF" font-size="14" dominant-baseline="middle" text-anchor="end" transform="translate(55.14062690734863, 56.5) rotate(