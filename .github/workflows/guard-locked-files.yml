name: Guard locked files

# Layer 3 of the FCC-autonomy stack.
#
# Fails any PR / push that touches the design-locked files without an
# explicit override in the commit message. Prevents the specific damage
# we saw on 2026-09-03 (FCC re-introduced the theme toggle + reverted
# design tokens because the project looked "in Phase 1" to it).
#
# Locked files (per Brain/FCC-DO-NOT.md):
#   - styles/globals.css          (always-dark theme tokens — no light mode)
#   - src/components/Theme*.*     (theme toggle + provider + initializer)
#   - src/components/AudioCues*.* (audio system, removed by user)
#   - src/components/IntroLoader* (lock-down candidate; was kept — verify
#                                   intent before adding here)
#
# Override: include OVERRIDE-LOCK: <reason> in commit subject OR body.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Detect locked-file changes
        id: detect
        run: |
          set -euo pipefail

          # Compare against the previous commit on the same branch
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          # List changed files (added/modified/renamed). 'D' (deleted) is fine
          # because removing a locked file is a de-lock, which is what we want.
          CHANGED=$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" || true)

          LOCKED_PATTERN='^(styles/globals\.css|src/components/Theme[A-Z][a-zA-Z]*\.(ts|tsx|js|jsx)|src/components/AudioCues[A-Za-z]*\.(ts|tsx|js|jsx))$'

          VIOLATIONS=$(echo "$CHANGED" | grep -E "$LOCKED_PATTERN" || true)

          if [ -z "$VIOLATIONS" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "no locked files touched"
            exit 0
          fi

          echo "Locked files touched:"
          echo "$VIOLATIONS"
          echo ""

          # Check for OVERRIDE-LOCK: in commit messages (PR commits + push head)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MESSAGES=$(git log --format='%s%n%n%b' "$BASE_SHA..$HEAD_SHA" || true)
          else
            MESSAGES=$(git log -1 --format='%s%n%n%b' "$HEAD_SHA" || true)
          fi

          if echo "$MESSAGES" | grep -qE '^OVERRIDE-LOCK:'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "OVERRIDE-LOCK found in commit message — proceeding"
            exit 0
          fi

          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::error::Touched locked files without OVERRIDE-LOCK: marker."
          echo "::error::To override, include a line starting with OVERRIDE-LOCK: <reason>"
          echo "::error::in any commit subject or body in this PR/push."
          echo "::error::See Brain/FCC-DO-NOT.md for why these files are locked."
          exit 1
