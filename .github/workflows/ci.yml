name: CI

# Enforces the mandatory git workflow in AGENTS.md: no PR or direct push to
# main may break lint, typecheck, or the production build.
#
# Runs on every pull request targeting main, and as a safety net on pushes to
# main. Vercel deploys independently after the merge; this gate is the quality
# check before code ever reaches main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: lint + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build